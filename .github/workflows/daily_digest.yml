name: Morning AI Digest

on:
  schedule:
    # 00:30 UTC = 06:00 Asia/Kolkata
    - cron: "30 0 * * *"
  workflow_dispatch:

concurrency:
  group: morning-ai-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile run_digest.py

      - name: Run Morning AI Digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TIMEZONE: Asia/Kolkata
          PYTHONUNBUFFERED: "1"
        run: python run_digest.py

      - name: Persist seen history
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git add seen_history.json

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "Update morning digest history [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No history changes to commit."
          fi
