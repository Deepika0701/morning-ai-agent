name: Morning AI Engineering Digest

on:
  schedule:
    # Daily at 8:05 AM IST
    - cron: "5 8 * * *"
      timezone: "Asia/Kolkata"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

concurrency:
  group: morning-ai-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send-digest:
    name: Generate and Send AI Engineering Digest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Non-sensitive configuration
    env:
      TIMEZONE: Asia/Kolkata
      MAX_NEWS_AGE_HOURS: "24"
      MAX_TOOL_AGE_HOURS: "168"
      MAX_SECURITY_AGE_HOURS: "168"
      MAX_EMAIL_NEWS_ITEMS: "5"
      PYTHONUNBUFFERED: "1"

    steps:
      # ------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v7

      # ------------------------------------------------
      # 2. Setup Python
      # ------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # ------------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------
      # 4. Validate Python
      # ------------------------------------------------
      - name: Validate Python syntax
        run: |
          python -m py_compile run_digest.py

      # ------------------------------------------------
      # 5. Run Morning AI Agent
      # ------------------------------------------------
      - name: Generate and send Morning AI Digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

        run: |
          python run_digest.py

      # ------------------------------------------------
      # 6. Persist history
      # ------------------------------------------------
      - name: Persist seen history
        run: |
          git add seen_history.json

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "Update morning digest history [skip ci]"

            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No history changes to commit."
          fi
