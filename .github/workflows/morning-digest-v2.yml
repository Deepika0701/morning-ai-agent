
name: Morning AI Engineering Briefing v2

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *' # 06:00 Asia/Kolkata (IST)

permissions:
  contents: write # Required only to commit seen_history.json

concurrency:
  group: morning-ai-engineering-briefing
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile run_digest.py run_digest_v2.py

      - name: Generate and send morning briefing
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TIMEZONE: Asia/Kolkata
          GEMINI_MODEL: gemini-2.5-flash
          GROQ_MODEL: openai/gpt-oss-20b
          OPENROUTER_MAX_ATTEMPTS: '2'
        run: python run_digest_v2.py

      - name: Commit successfully processed history
        run: |
          if git diff --quiet -- seen_history.json; then
            echo 'No history changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seen_history.json
          git commit -m 'Update morning AI digest history'
          git push
